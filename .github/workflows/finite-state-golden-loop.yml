name: Finite State Golden Loop

on:
  push:
    branches:
      - main
      - finite-state/integration
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  PNPM_VERSION: "9.15.0"

concurrency:
  group: finite-state-golden-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-golden-loop:
    name: Offline Golden Loop (Node 22.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with worktree seed history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "22.19.0"
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: finite-state-golden-loop

      - name: Run the offline Golden Loop twice
        run: pnpm exec turbo run test --filter=bb-plugin-finite-state -- test/e2e/golden-loop/golden-loop.e2e.test.ts
